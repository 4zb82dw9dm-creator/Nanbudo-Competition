<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" role="img" aria-label="Fond panoramique Nanbudo Competition sans texte">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3640"/><stop offset="0.55" stop-color="#596674"/><stop offset="1" stop-color="#79423f"/></linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7e3a37"/><stop offset="1" stop-color="#b9675f"/></linearGradient>
    <linearGradient id="giBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#202bb2"/><stop offset="0.5" stop-color="#3840d6"/><stop offset="1" stop-color="#151a84"/></linearGradient>
    <radialGradient id="spot" cx="50%" cy="20%" r="70%"><stop offset="0" stop-color="#edf4ff" stop-opacity=".42"/><stop offset="1" stop-color="#edf4ff" stop-opacity="0"/></radialGradient>
    <filter id="bgBlur"><feGaussianBlur stdDeviation="16"/></filter>
