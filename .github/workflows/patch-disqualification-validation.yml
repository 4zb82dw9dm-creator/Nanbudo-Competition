name: Patch manual disqualification validation

on:
  push:
    paths:
      - '.github/workflows/patch-disqualification-validation.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-disqualification-validation-v4
      - name: Patch MatchManager
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/MatchManager.jsx')
          s = p.read_text()

          s = s.replace('  const automaticSaveDone = useRef(false);\n', '')
          s = s.replace('    automaticSaveDone.current = false;\n', '')

          old_effect = '''  useEffect(() => {\n    if (isKata || isEditing || automaticSaveDone.current) return;\n    if (!isDisqualified(penalties.aka) && !isDisqualified(penalties.shiro)) return;\n    automaticSaveDone.current = true;\n    save();\n  }, [isEditing, isKata, penalties, randoriScore.winner]);\n\n'''
          if old_effect not in s:
              raise SystemExit('Automatic-save effect not found')
          s = s.replace(old_effect, '')

          marker = '  if (draft.pendingDraft) return <section className="match-manager"><DraftRecoveryNotice draft={draft.pendingDraft} onResume={draft.resume} onAbandon={draft.abandon} /></section>;\n'
          insert = '''  const akaDisqualified = isDisqualified(penalties.aka);\n  const shiroDisqualified = isDisqualified(penalties.shiro);\n  const penaltyDisqualification = akaDisqualified || shiroDisqualified;\n  const disqualifiedSide = akaDisqualified && !shiroDisqualified ? "aka" : shiroDisqualified && !akaDisqualified ? "shiro" : null;\n  const disqualifiedCompetitor = disqualifiedSide ? match[disqualifiedSide] : null;\n  const winnerCompetitor = randoriScore.winner ? match[randoriScore.winner] : null;\n\n'''
          if marker not in s:
              raise SystemExit('Draft marker not found')
          s = s.replace(marker, insert + marker)

          old_return = '''  return <section className="match-manager randori-sheet"><div className="match-meta"><p><strong>Discipline</strong>{competitionRulesEngine.disciplineLabel(match.discipline)}</p><p><strong>Catégorie</strong>{match.categoryName || "Non renseignée"}</p><p><strong>Poule</strong>{match.poolName || match.poolId || "Non renseignée"}</p></div><ControlPanel match={match} score={randoriScore} penalties={penalties} maiWarnings={maiWarnings} hasMai={hasMai} onAddPenalty={addPenalty} onRemovePenalty={removePenalty} onRemoveMai={removeLastMai} disabled={isLocked} /><AssaultCards title={match.discipline === "randori" ? "Les 7 assauts · format court possible : Tsuki 1, Mae Geri 1, Mawashi 1" : "Les 7 assauts"} rows={assaults} disabled={isLocked} hasMai={hasMai} maiWarnings={maiWarnings} onAddMai={addMai} onVote={(rowIndex, judgeIndex, value) => setVote("main", rowIndex, judgeIndex, value)} /><div className={`match-result ${randoriScore.winner ? "winner-highlight" : ""}`}><h3>Résultat du combat</h3><p>{randoriScore.winner === "aka" ? `AKA · ${match.aka?.nom} ${match.aka?.prenom}` : randoriScore.winner === "shiro" ? `SHIRO · ${match.shiro?.nom} ${match.shiro?.prenom}` : "Égalité"}</p><button className="primary kata-validate" onClick={save} disabled={isLocked || !randoriScore.complete}>{isLocked ? "Combat validé" : "Valider le combat"}</button></div></section>;\n'''
          new_return = '''  return <section className="match-manager randori-sheet"><div className="match-meta"><p><strong>Discipline</strong>{competitionRulesEngine.disciplineLabel(match.discipline)}</p><p><strong>Catégorie</strong>{match.categoryName || "Non renseignée"}</p><p><strong>Poule</strong>{match.poolName || match.poolId || "Non renseignée"}</p></div><ControlPanel match={match} score={randoriScore} penalties={penalties} maiWarnings={maiWarnings} hasMai={hasMai} onAddPenalty={addPenalty} onRemovePenalty={removePenalty} onRemoveMai={removeLastMai} disabled={isLocked} />{penaltyDisqualification && <div className="match-result winner-highlight" role="alert" aria-live="assertive" style={{ border: "3px solid #b71c1c", background: "#fff3f3", padding: "18px", margin: "18px 0", textAlign: "center" }}><h3 style={{ color: "#b71c1c", marginBottom: "10px" }}>⛔ DISQUALIFICATION — COMBAT TERMINÉ</h3>{disqualifiedSide ? <><p><strong>{disqualifiedSide.toUpperCase()} · {disqualifiedCompetitor?.nom} {disqualifiedCompetitor?.prenom}</strong> : PERDANT par disqualification</p><p><strong>{randoriScore.winner?.toUpperCase()} · {winnerCompetitor?.nom} {winnerCompetitor?.prenom}</strong> : VAINQUEUR</p></> : <p>Disqualification détectée. Vérifiez les sanctions avant validation.</p>}<p>Le résultat ne sera enregistré qu'après validation de l'arbitre.</p></div>}<AssaultCards title={match.discipline === "randori" ? "Les 7 assauts · format court possible : Tsuki 1, Mae Geri 1, Mawashi 1" : "Les 7 assauts"} rows={assaults} disabled={isLocked || penaltyDisqualification} hasMai={hasMai} maiWarnings={maiWarnings} onAddMai={addMai} onVote={(rowIndex, judgeIndex, value) => setVote("main", rowIndex, judgeIndex, value)} /><div className={`match-result ${randoriScore.winner ? "winner-highlight" : ""}`}><h3>{penaltyDisqualification ? "Fin du combat par disqualification" : "Résultat du combat"}</h3><p>{randoriScore.winner === "aka" ? `AKA · ${match.aka?.nom} ${match.aka?.prenom}` : randoriScore.winner === "shiro" ? `SHIRO · ${match.shiro?.nom} ${match.shiro?.prenom}` : "Égalité"}</p><button className="primary kata-validate" onClick={save} disabled={isLocked || (!randoriScore.complete && !penaltyDisqualification)}>{isLocked ? "Combat validé" : penaltyDisqualification ? "Valider la fin du combat" : "Valider le combat"}</button></div></section>;\n'''
          if old_return not in s:
              raise SystemExit('Randori return block not found')
          s = s.replace(old_return, new_return)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/MatchManager.jsx
          git diff --cached --check
          git commit -m 'fix: require referee validation after disqualification'
          git push origin HEAD:fix/manual-disqualification-validation-v4
